name: Feature Request
description: Suggest an idea for Microgreens
title: "[FR] "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Fill in the required fields; skip the others if they do not apply.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      options:
        - label: I have searched the [existing issues](https://github.com/3dg1luk43/ha-microgreens/issues) and this feature has not already been requested.
          required: true
        - label: This request is about Microgreens, not Home Assistant itself or another integration.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this solve, or what does it let you do? Be specific.
      placeholder: "When I grow several trays of the same crop, I cannot..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What you want to happen. Be as concrete as possible.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related Area
      description: Which part of Microgreens does this touch?
      options:
        - General
        - Sidebar panel
        - Lovelace card
        - Notifications
        - Entities (sensors, buttons, to-do list)
        - Services / automations
        - Crops and grow schedule
        - Harvest history and statistics
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Workarounds you have tried, or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to related issues.
    validations:
      required: false

  - type: checkboxes
    id: pr_intention
    attributes:
      label: Contributing an Implementation
      description: >
        Want to build this yourself? Agree the work with the maintainer **before** you write any code.


        1. Tick the box below.

        2. Wait for the maintainer to add the `accepted` label. That is where scope and approach are agreed: the feature may already be planned, in progress, or out of scope.

        3. Only then open a PR referencing this issue.


        A PR opened in parallel with a not-yet-accepted issue is not reviewed until the maintainer decides on the issue.
      options:
        - label: I plan to submit a PR implementing this, and I will wait for the `accepted` label before opening it
          required: false
