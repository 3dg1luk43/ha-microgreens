name: Documentation Improvement
description: Report missing, incorrect or unclear documentation
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the documentation!

        Want to fix it yourself? Tick the box below and wait for the `accepted` label before opening a PR; documentation PRs follow the same [contributor flow](https://github.com/3dg1luk43/ha-microgreens/blob/main/CONTRIBUTING.md#agree-the-work-before-you-write-code) as code. Wrong or missing translations are the exception: see [Translations](https://github.com/3dg1luk43/ha-microgreens/blob/main/CONTRIBUTING.md#translations).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before You Submit
      options:
        - label: I have checked that this documentation problem has not already been reported.
          required: true
        - label: I plan to submit a PR fixing this, and I will wait for the `accepted` label first (leave unchecked if you just want to report it).
          required: false

  - type: input
    id: page
    attributes:
      label: Page / Section
      description: Which file or section needs improvement?
      placeholder: "README.md → Notifications"
    validations:
      required: true

  - type: textarea
    id: wrong
    attributes:
      label: What is Wrong or Missing?
      description: Describe the inaccuracy, gap or confusing part. Quote the existing text if relevant.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Change
      description: If you can, propose the corrected or new text. A rough draft helps.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links or anything else that helps.
    validations:
      required: false
