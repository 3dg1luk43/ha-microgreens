name: Release Preflight

# devtools/release_check.sh against a pushed tag: the tag, manifest.json's version
# and the top CHANGELOG heading must agree, and the entry must be dated. Tests
# re-run on purpose: a tag can be pushed from a commit that never ran them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to verify against (e.g. v0.2.0). Empty: manifest.json vs CHANGELOG only."
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: pip install -r requirements-test.txt ruff==0.15.20
      - name: Resolve the version under test
        id: ver
        env:
          # Never interpolate a dispatch input into shell code.
          TAG_INPUT: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          TAG="${TAG_INPUT:-$REF_TAG}"
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^v?[0-9][A-Za-z0-9._-]*$'; then
            echo "Not a version tag: $TAG" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
      - name: Release check
        env:
          WANT_TAG: ${{ steps.ver.outputs.tag }}
          PYTHON: python
        run: bash devtools/release_check.sh --tag "$WANT_TAG"
