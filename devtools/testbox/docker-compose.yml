# Microgreens test box: a disposable, real Home Assistant with the working tree
# mounted read-only. Nothing here can reach the real Home Assistant.
#   config/   generated HA config dir (gitignored; ./down.sh --wipe deletes it)
name: microgreens-testbox

services:
  ha:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: microgreens-testbox-ha
    restart: "no"
    ports:
      - "127.0.0.1:8324:8123"
    environment:
      TZ: Europe/Prague
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./config:/config
      - ../../custom_components/ha_microgreens:/config/custom_components/ha_microgreens:ro
      - ./support/custom_components/testbox_notify:/config/custom_components/testbox_notify:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/manifest.json', timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
